# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  packages:
    taskfile: ./packages/Taskfile.yml
    dir: ./packages

vars:
  NIXNAME:
    sh: echo "${NIXNAME:-$(hostname)}"

tasks:
  switch:
    desc: Apply the system config (sudo), then the Home Manager config
    aliases: [run]
    cmds:
      - task: system
      - task: home

  system:
    desc: Apply the system config (sudo)
    cmds:
      - task: system-darwin
      - task: system-nixos
    status:
      - "false"

  system-darwin:
    internal: true
    platforms: [darwin]
    cmds:
      - nix build --extra-experimental-features nix-command --extra-experimental-features flakes ".#darwinConfigurations.{{.NIXNAME}}.system"
      - sudo ./result/sw/bin/darwin-rebuild switch --flake "$(pwd)#{{.NIXNAME}}"

  system-nixos:
    internal: true
    platforms: [linux]
    cmds:
      - sudo NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM=1 nixos-rebuild switch --flake ".#{{.NIXNAME}}"

  home:
    desc: Apply the Home Manager config (no sudo)
    cmds:
      - home-manager switch --flake ".#$USER@{{.NIXNAME}}"

  test:
    desc: Build and test the system config (sudo), then the Home Manager config
    cmds:
      - task: test-system
      - task: test-home

  test-system:
    desc: Build and test the system config (sudo)
    cmds:
      - task: test-system-darwin
      - task: test-system-nixos
    status:
      - "false"

  test-system-darwin:
    internal: true
    platforms: [darwin]
    cmds:
      - nix build --extra-experimental-features nix-command --extra-experimental-features flakes ".#darwinConfigurations.{{.NIXNAME}}.system"
      - sudo ./result/sw/bin/darwin-rebuild check --flake "$(pwd)#{{.NIXNAME}}"

  test-system-nixos:
    internal: true
    platforms: [linux]
    cmds:
      - sudo NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM=1 nixos-rebuild test --flake ".#{{.NIXNAME}}"

  test-home:
    desc: Build the Home Manager config without activating it (no sudo)
    cmds:
      - home-manager build --flake ".#$USER@{{.NIXNAME}}"

  install:
    desc: Initial install of nix
    cmds:
      - task: install-darwin
      - task: install-other

  install-darwin:
    desc: Install determinate Nix on macOS using native pkg
    internal: true
    platforms: [darwin]
    cmds:
      - curl -L https://install.determinate.systems/determinate-pkg/stable/Universal -o /tmp/determinate-nix.pkg
      - sudo installer -pkg /tmp/determinate-nix.pkg -tgt /

  install-other:
    desc: Install nix on Linux and Windows
    internal: true
    platforms: [linux, windows]
    cmds:
      - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install

  update-all:
    desc: Update external flakes
    cmds:
      - nix flake update
      - git add flake.lock
      - 'git commit -S -m "chore(nix): Update deps"'

  update-input:
    desc: "Update flake inputs and commit the lock. Names as args (task update-input -- clb-skills), or pick with fzf"
    interactive: true
    preconditions:
      - sh: command -v jq && command -v nix && { [ -n "{{.CLI_ARGS}}" ] || command -v fzf; }
        msg: Requires jq and nix in PATH, plus fzf when no input names are given
    cmds:
      - |
        if [ -n "{{.CLI_ARGS}}" ]; then
          set -- {{.CLI_ARGS}}
        else
          inputs=$(jq -r '.nodes[.root].inputs | keys[]' flake.lock)
          if selected=$(printf '%s\n' "$inputs" | fzf --multi --prompt='Update input> ' --header='Tab: select multiple | Enter: update | Esc: cancel'); then
            [ -n "$selected" ] || exit 0
            set --
            while IFS= read -r input; do
              set -- "$@" "$input"
            done <<EOF
        $selected
        EOF
          else
            status=$?
            case "$status" in
              1|130) exit 0 ;;
              *) exit "$status" ;;
            esac
          fi
        fi
        nix flake update "$@"
        git add flake.lock
        if git diff --cached --quiet -- flake.lock; then
          echo "flake.lock unchanged: $* already current"
        else
          git commit -S -m "chore(nix): Update $* dep"
        fi

  skills:
    desc: "Ship pushed clb-skills commits: update the lock, commit, push, then task home"
    cmds:
      - task: update-input
        vars: { CLI_ARGS: clb-skills }
      - git push
      - task: home

  clean:
    desc: Cleanup nix garbage
    cmds:
      - nix-store --optimise
      - sudo nix-collect-garbage -d

  rename-mac:
    desc: Rename macOS computer names (HostName, ComputerName, LocalHostName)
    platforms: [darwin]
    interactive: true
    cmds:
      - |
        NAME="{{.CLI_ARGS}}"
        if [ -z "$NAME" ]; then
          read -r -p "Enter computer name: " NAME
        fi
        if [ -z "$NAME" ]; then
          echo "Error: No computer name provided." >&2
          exit 1
        fi
        echo "Updating computer names to $NAME..."
        sudo scutil --set HostName "$NAME"
        sudo scutil --set ComputerName "$NAME"
        sudo scutil --set LocalHostName "$NAME"
        echo "Computer names updated successfully."
